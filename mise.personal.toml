# ref: https://mise.jdx.dev/configuration/environments.html
# Loaded with `-E personal` only. mise merges configuration additively, so the
# base `mise.toml` holds what is safe on any machine and this file adds the rest.

# System services are unavailable on non-systemd Linux and other platforms.
# Local includes keep all relative sources owned by this root config.
include = ["{% if os() == 'linux' and '/run/systemd/system' is dir %}./mise/linux-services.toml{% else %}./mise/linux-files.toml{% endif %}"]

[bootstrap.linux.systemd.units.cloudflared]
description = "Cloudflare Tunnel client"
after = ["network-online.target"]
wants = ["network-online.target"]
exec_start = "/usr/bin/cloudflared tunnel --no-autoupdate run --token-file %h/.config/cloudflared/tunnel-token"
restart = "on-failure"
restart_sec = "5s"

[bootstrap.packages]
# The matching APT sources below apply only with this personal profile.
"apt:cloudflared" = "latest"
# kuebiko drives it with `--browser-command google-chrome`.
"apt:google-chrome-stable" = "latest"

[bootstrap.repos]
"~/.ghr/github.com/risu729/aqua" = { url = "https://github.com/risu729/aqua.git" }
"~/.ghr/github.com/risu729/aqua-registry" = { url = "https://github.com/risu729/aqua-registry.git" }
"~/.ghr/github.com/risu729/biwa" = { url = "https://github.com/risu729/biwa.git" }
"~/.ghr/github.com/risu729/hk" = { url = "https://github.com/risu729/hk.git" }
"~/.ghr/github.com/risu729/hk-config" = { url = "https://github.com/risu729/hk-config.git" }
"~/.ghr/github.com/risu729/kuebiko" = { url = "https://github.com/risu729/kuebiko.git" }
"~/.ghr/github.com/risu729/mikoto" = { url = "https://github.com/risu729/mikoto.git" }
"~/.ghr/github.com/risu729/mise" = { url = "https://github.com/risu729/mise.git" }
"~/.ghr/github.com/risu729/mise-action" = { url = "https://github.com/risu729/mise-action.git" }
"~/.ghr/github.com/risu729/renovate-config" = { url = "https://github.com/risu729/renovate-config.git" }
"~/.ghr/github.com/risu729/tsconfigs" = { url = "https://github.com/risu729/tsconfigs.git" }

# ref: https://pkg.cloudflare.com/
[bootstrap.apt.sources.cloudflared]
uris = "https://pkg.cloudflare.com/cloudflared"
suites = "any"
components = "main"
key = "https://pkg.cloudflare.com/cloudflare-main.gpg"
fingerprint = "CC94B39C77AE7342A68B89628A682D308D4E5E73"

# ref: https://www.google.com/linuxrepositories/
[bootstrap.apt.sources.google-chrome]
uris = "https://dl.google.com/linux/chrome-stable/deb/"
suites = "stable"
components = "main"
architectures = "amd64"
key = "https://dl.google.com/linux/linux_signing_key.pub"
fingerprint = "EB4C1BFD4F042F6DDDCCEC917721F63BD38B4796"

# Keep source-bearing declarations at the repository root. These files must
# exist before the post-packages hook validates sshd and activates the units.
[bootstrap.directories."/etc/ssh/sshd_config.d"]
phase = "pre-packages"
owner = "root"
group = "root"
mode = "0755"
os = "linux"
