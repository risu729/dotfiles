name: Prepare repository tools
description: Install the pinned mise tools, optionally caching verified downloads.
inputs:
  cache-downloads:
    description: Restore and save verified downloads; never cache installed tools.
    default: 'true'
    required: false
runs:
  using: composite
  steps:
    - name: Cache verified mise downloads
      if: ${{ inputs.cache-downloads == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/mise/downloads-cas
        key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock') }}
        restore-keys: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
    - name: Install mise
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        version: 2026.11.5
        cache: false
