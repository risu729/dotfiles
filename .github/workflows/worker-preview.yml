name: Worker Preview
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'unix/home/**'
      - 'unix/codex/**'
      - 'unix/ssh/**'
      - 'unix/systemd/**'
      - 'wsl/**'
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- Closed-event cleanup uses only trusted base checkout and a pinned action; no PR code runs.
    types: [closed]
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  preview:
    name: Deploy or clean up Preview
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      # This workflow is separate from CI so cancellation cannot interrupt an upload.
      group: worker-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read # for live PR state verification
    env:
      MISE_ENABLE_TOOLS: bun,node
    steps:
      - name: Check current PR state and credentials
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          CLEANUP: ${{ github.event_name == 'pull_request_target' }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "${ACCOUNT_ID}" && -z "${API_TOKEN}" ]]; then
            echo 'No Preview credentials; production build validation still runs in CI.' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          [[ -n "${ACCOUNT_ID}" && -n "${API_TOKEN}" ]] || exit 1
          pr="$(gh pr view "${PR_NUMBER}" --json state,headRefOid)"
          if [[ "${CLEANUP}" == true ]]; then
            [[ "$(jq -r '.state' <<< "${pr}")" != OPEN ]] || exit 0
          else
            jq -e --arg head "${EXPECTED_HEAD}" '.state == "OPEN" and .headRefOid == $head' <<< "${pr}" > /dev/null || exit 0
          fi
          echo 'run=true' >> "${GITHUB_OUTPUT}"
      - name: Checkout tested source or trusted base for cleanup
        if: steps.current.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request_target checks out the trusted base, never the PR head.
          persist-credentials: false
      - name: Cache verified mise downloads
        if: steps.current.outputs.run == 'true' && github.event_name != 'pull_request_target'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/downloads-cas
          key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock') }}
          restore-keys: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install mise
        if: steps.current.outputs.run == 'true' && github.event_name != 'pull_request_target'
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          cache: false
      - name: Test Worker before Preview deployment
        if: steps.current.outputs.run == 'true' && github.event_name != 'pull_request_target'
        run: mise run worker:test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build Preview
        if: steps.current.outputs.run == 'true' && github.event_name != 'pull_request_target'
        run: mise run worker:build:preview
      - name: Deploy or delete Preview
        id: preview
        if: steps.current.outputs.run == 'true'
        uses: risu729/wrangler-deploy-action@6a93154ef1c550b760d8582bcf59d8d4a0710788 # v2.2.1
        with:
          mode: ${{ github.event_name == 'pull_request_target' && 'delete-preview' || 'worker-preview' }}
          working-directory: worker
          worker: dotfiles-worker
          preview-name: pr-${{ github.event.pull_request.number }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify Preview response
        if: steps.current.outputs.run == 'true' && github.event_name != 'pull_request_target'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          printf 'Preview URL: %s\n' "${PREVIEW_URL}"
          [[ "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${PREVIEW_URL}/")" == 307 ]]
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 --silent --show-error "${PREVIEW_URL}/wsl?ref=${EXPECTED_REVISION}" | grep -F "${EXPECTED_REVISION}"
