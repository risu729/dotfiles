name: Upstream Health
on:
  schedule:
    - cron: "0 0 * * SUN"
  workflow_dispatch:
concurrency:
  # The caller and called CI must hold different groups. Keep every health run.
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: false
  queue: max
permissions: {}
jobs:
  health:
    name: Full installer and upstream checks
    permissions:
      contents: read # for checkout in the reusable workflow
      actions: read # for the actions timeline in the reusable workflow
    uses: $/.github/workflows/ci.yml
    with:
      full: true
      health: true
