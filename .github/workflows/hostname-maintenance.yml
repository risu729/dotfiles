name: Hostname maintenance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Plan reads metadata; apply requires the reviewed plan digest
        type: choice
        options: [plan, apply]
        default: plan
      expected-plan-sha256:
        description: Copy the plan digest from the same main revision before applying
        type: string
        default: ""
concurrency:
  group: hostname-maintenance-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
env:
  MISE_ENABLE_TOOLS: node
jobs:
  validate:
    name: Validate hostname maintenance
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          install_args: node
      - name: Resolve the pinned Node executable
        id: runtime
        run: echo "node=$(mise which node)" >> "${GITHUB_OUTPUT}"
      - name: Test hostname-only maintenance without credentials
        env:
          NODE_BINARY: ${{ steps.runtime.outputs.node }}
        run: '"${NODE_BINARY}" --test .github/scripts/hostname-maintenance.test.mts'
  maintain:
    name: Maintain reviewed hostname attachments
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: worker-production
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          install_args: node
      - name: Resolve the pinned Node executable before loading credentials
        id: runtime
        run: echo "node=$(mise which node)" >> "${GITHUB_OUTPUT}"
      - name: Require the current main revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          current=$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq .object.sha)
          [[ "${current}" == "${EXPECTED_REVISION}" ]] || exit 1
      - name: Plan or apply only the reviewed hostname attachments
        env:
          NODE_BINARY: ${{ steps.runtime.outputs.node }}
          MAINTENANCE_OPERATION: ${{ inputs.operation }}
          MAINTENANCE_TARGET: worker
          EXPECTED_PLAN_SHA256: ${{ inputs.expected-plan-sha256 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: '"${NODE_BINARY}" .github/scripts/hostname-maintenance.mts'
