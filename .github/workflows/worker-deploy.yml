name: Worker Deploy
on:
  workflow_call:
    inputs:
      production:
        description: Publish to production after main validation
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
concurrency:
  group: worker-${{ inputs.production && 'production' || format('validation-{0}', github.run_id) }}
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  deploy:
    name: ${{ inputs.production && 'Deploy' || 'Validate downloaded artifact' }}
    if: ${{ !inputs.production || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: bun,node
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            mise.toml
            mise.lock
            tasks.toml
            tasks/
            worker/
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.1
      - name: Install deployment CLI from the lockfile
        working-directory: worker
        run: bun install --frozen-lockfile
      - name: Download validated Worker
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker-build
          path: out/worker-artifact/
      - name: Verify and restore the artifact
        run: bash tasks/ci/worker-artifact restore
        env:
          EXPECTED_REVISION: ${{ github.sha }}
      - name: Validate Worker deployment
        if: ${{ !inputs.production }}
        working-directory: worker
        run: bun run cf workers versions create --prebuilt --mode production --dry-run
      - name: Deploy Worker version
        if: ${{ inputs.production }}
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          output_file=$(mktemp)
          trap 'rm -f -- "${output_file}"' EXIT
          # cf beta uses this structured upload output from its deployment backend.
          export WRANGLER_OUTPUT_FILE_PATH="${output_file}"
          # Keep the existing Custom Domain; per-Worker tokens cannot manage it.
          bun run cf workers versions create --prebuilt --mode production
          version_id=$(jq --slurp --raw-output --exit-status '
            map(select(.type == "version-upload" and .worker_name == "dotfiles-worker"))
            | if length == 1 then .[0].version_id else error("Expected one uploaded version") end
            | select(type == "string" and test("^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$"))
          ' "${output_file}")
          versions=$(jq --null-input --compact-output --arg id "${version_id}" '[{version_id: $id, percentage: 100}]')
          bun run cf workers deployments create --worker dotfiles-worker --strategy percentage --versions "${versions}"
