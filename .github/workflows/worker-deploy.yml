name: Worker Deploy
on:
  workflow_call:
    inputs:
      production:
        description: Publish to production after main validation
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
concurrency:
  group: worker-${{ inputs.production && 'production' || format('validation-{0}', github.run_id) }}
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  deploy:
    name: ${{ inputs.production && 'Deploy' || 'Validate downloaded artifact' }}
    if: ${{ !inputs.production || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: bun,node
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            mise.toml
            mise.lock
            tasks.toml
            tasks/
            worker/
          persist-credentials: false
      - name: Cache verified mise downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/downloads-cas
          key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock') }}
          restore-keys: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          cache: false
      - name: Install deployment CLI from the lockfile
        run: mise deps bun-worker
      - name: Download validated Worker
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-build
          path: out/worker-artifact/
      - name: Verify and restore the artifact
        # Restore must not install dependencies or rebuild the validated bundle.
        run: mise run --skip-tools --no-deps ci:worker-artifact restore
        env:
          EXPECTED_REVISION: ${{ github.sha }}
      - name: Validate or deploy Worker version
        uses: risu729/wrangler-deploy-action@a9db854f3a31cdf3cdf28977e66f52f32fc9e8a0 # v2.2.2
        with:
          mode: ${{ inputs.production && 'production' || 'dry-run' }}
          working-directory: worker
          worker: dotfiles-worker
          build-mode: production
          # Use only Individual Workers Editor scoped to dotfiles-worker.
          # Preserve the existing domain without zone Workers Routes permissions.
          # Manage Custom Domain and route changes separately.
          deploy-triggers: 'false'
          cloudflare-account-id: ${{ inputs.production && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          cloudflare-api-token: ${{ inputs.production && secrets.CLOUDFLARE_API_TOKEN || '' }}
