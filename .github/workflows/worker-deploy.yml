name: Worker Deploy
on:
  workflow_call:
    inputs:
      production:
        description: Publish to production after main validation
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
concurrency:
  group: worker-${{ inputs.production && 'production' || format('validation-{0}', github.run_id) }}
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  deploy:
    name: ${{ inputs.production && 'Deploy' || 'Validate downloaded artifact' }}
    if: ${{ !inputs.production || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: bun,node
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            mise.toml
            mise.lock
            tasks.toml
            tasks/
            worker/
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.2
      - name: Install deployment CLI from the lockfile
        working-directory: worker
        run: bun install --frozen-lockfile
      - name: Download validated Worker
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker-build
          path: out/worker-artifact/
      - name: Verify and restore the artifact
        run: bash tasks/ci/worker-artifact restore
        env:
          EXPECTED_REVISION: ${{ github.sha }}
      - name: Validate or deploy Worker version
        uses: risu729/wrangler-deploy-action@c2c1bf1396daf8ec7de4189e7b0dc92cab32f244 # v2.1.0
        with:
          mode: ${{ inputs.production && 'production' || 'dry-run' }}
          working-directory: worker
          worker: dotfiles-worker
          build-mode: production
          # Preserve the existing Custom Domain with the Worker-scoped token.
          deploy-triggers: 'false'
          cloudflare-account-id: ${{ inputs.production && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          cloudflare-api-token: ${{ inputs.production && secrets.CLOUDFLARE_API_TOKEN || '' }}
