name: Worker Artifact Validation
on:
  workflow_call:
concurrency:
  group: worker-validation-${{ github.run_id }}
  cancel-in-progress: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  validate:
    name: Validate downloaded artifact
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: aube,bun,node
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            mise.toml
            mise.lock
            tasks.toml
            tasks/
            worker/
          persist-credentials: false
      - name: Cache verified mise downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mise/downloads-cas
          key: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('mise.lock') }}
          restore-keys: mise-downloads-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.15
          cache: false
      - name: Install deployment CLI from the lockfile
        run: mise deps aube-worker
      - name: Download validated Worker
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-build
          path: out/worker-artifact/
      - name: Verify and restore the artifact
        # Restore must not install dependencies or rebuild the validated bundle.
        run: mise run --skip-tools --no-deps ci:worker-artifact restore
        env:
          EXPECTED_REVISION: ${{ github.sha }}
      - name: Validate Worker version
        uses: risu729/wrangler-deploy-action@a9db854f3a31cdf3cdf28977e66f52f32fc9e8a0 # v2.2.2
        with:
          mode: dry-run
          working-directory: worker
          worker: dotfiles-worker
          build-mode: production
          deploy-triggers: 'false'
