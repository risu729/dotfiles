name: Preview Lifecycle Validation
on:
  pull_request:
    paths: ['.github/workflows/preview-smoke.yml']
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  lifecycle:
    name: Create update delete Preview with existing scoped token
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: preview-lifecycle-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read # for checkout
    env:
      MISE_ENABLE_TOOLS: bun,node
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.10.1
      - name: Build Preview and record production allocation
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun run cf-vite build --preview
          bun run cf workers deployments list --worker dotfiles-worker > "${RUNNER_TEMP}/production-before.json"
      - name: Create Preview
        id: create
        uses: risu729/wrangler-deploy-action@561bbb845e7d4033808f88132646dd3ecbfca931 # 561bbb845e7d4033808f88132646dd3ecbfca931 # zizmor: ignore[stale-action-refs,ref-version-mismatch] -- Candidate from Action PR 106 under live validation.
        with:
          mode: worker-preview
          working-directory: worker
          worker: dotfiles-worker
          preview-name: pr-${{ github.event.pull_request.number }}-lifecycle
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Update Preview
        id: update
        uses: risu729/wrangler-deploy-action@561bbb845e7d4033808f88132646dd3ecbfca931 # 561bbb845e7d4033808f88132646dd3ecbfca931 # zizmor: ignore[stale-action-refs,ref-version-mismatch] -- Candidate from Action PR 106 under live validation.
        with:
          mode: worker-preview
          working-directory: worker
          worker: dotfiles-worker
          preview-name: pr-${{ github.event.pull_request.number }}-lifecycle
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify stable Preview identity and deployment update
        env:
          CREATED_PREVIEW: ${{ steps.create.outputs.preview-id }}
          UPDATED_PREVIEW: ${{ steps.update.outputs.preview-id }}
          CREATED_DEPLOYMENT: ${{ steps.create.outputs.deployment-id }}
          UPDATED_DEPLOYMENT: ${{ steps.update.outputs.deployment-id }}
          PREVIEW_URL: ${{ steps.update.outputs.preview-url }}
        run: |
          [[ -n "${CREATED_PREVIEW}" && "${CREATED_PREVIEW}" == "${UPDATED_PREVIEW}" ]]
          [[ -n "${UPDATED_DEPLOYMENT}" && "${CREATED_DEPLOYMENT}" != "${UPDATED_DEPLOYMENT}" ]]
          printf 'Preview: %s\nInitial deployment: %s\nUpdated deployment: %s\nURL: %s\n' "${UPDATED_PREVIEW}" "${CREATED_DEPLOYMENT}" "${UPDATED_DEPLOYMENT}" "${PREVIEW_URL}"
          [[ "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${PREVIEW_URL}/")" == 307 ]]
      - name: Delete Preview
        id: delete
        if: always()
        uses: risu729/wrangler-deploy-action@561bbb845e7d4033808f88132646dd3ecbfca931 # 561bbb845e7d4033808f88132646dd3ecbfca931 # zizmor: ignore[stale-action-refs,ref-version-mismatch] -- Candidate from Action PR 106 under live validation.
        with:
          mode: delete-preview
          working-directory: worker
          worker: dotfiles-worker
          preview-name: pr-${{ github.event.pull_request.number }}-lifecycle
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify idempotent cleanup
        id: absent
        if: always()
        uses: risu729/wrangler-deploy-action@561bbb845e7d4033808f88132646dd3ecbfca931 # 561bbb845e7d4033808f88132646dd3ecbfca931 # zizmor: ignore[stale-action-refs,ref-version-mismatch] -- Candidate from Action PR 106 under live validation.
        with:
          mode: delete-preview
          working-directory: worker
          worker: dotfiles-worker
          preview-name: pr-${{ github.event.pull_request.number }}-lifecycle
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify unchanged production allocation
        if: always()
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun run cf workers deployments list --worker dotfiles-worker > "${RUNNER_TEMP}/production-after.json"
          diff -u "${RUNNER_TEMP}/production-before.json" "${RUNNER_TEMP}/production-after.json"
