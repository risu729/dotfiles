name: CI
on:
  push:
    branches:
      - main
  # Stacked PRs target their parent branch rather than main.
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all installer and Worker checks
        type: boolean
        default: true
      deploy:
        description: Deploy the validated Worker (main only)
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
      health:
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ inputs.health && 'health' || 'ci' }}-${{ case(github.event_name == 'pull_request', github.event.pull_request.number, github.ref) }}
  # Finish running main validations/deployments; superseded PR runs can stop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # for checkout
    outputs:
      installers: ${{ steps.select.outputs.installers }}
      worker: ${{ steps.select.outputs.worker }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select expensive checks
        id: select
        run: bash tasks/ci/select >> "${GITHUB_OUTPUT}"
        env:
          # Validate the complete main tree, including commits coalesced by concurrency.
          CI_FULL: ${{ inputs.full || inputs.health || github.event_name == 'push' || inputs.deploy }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
      - name: Run check
        if: ${{ !inputs.health }}
        run: mise run check --lint
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run flaky check
        if: ${{ inputs.health }}
        run: mise run check --lint --flaky
        env:
          GITHUB_TOKEN: ${{ github.token }}
  test-bats:
    name: Bats
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MISE_ENABLE_TOOLS: bats,bun
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
      - name: Run Bats tests
        run: mise run test:bats
  test-linux:
    needs: changes
    if: ${{ needs.changes.outputs.installers == 'true' }}
    name: Linux installer (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [bare, personal]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # for checkout
    env:
      COMPOSE_PROJECT_NAME: dotfiles-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
      # Match the Ubuntu release installed by win/install.ps1.
      WSL_IMAGE_URL: https://cdimages.ubuntu.com/ubuntu-wsl/resolute/daily-live/current/resolute-wsl-amd64.wsl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Docker Compose environment
        run: |
          mise_version=$(sed -n 's/^min_version = "\(.*\)"$/\1/p' mise.toml)
          if [[ -z ${mise_version} ]]; then
            echo "Failed to read mise min_version." >&2
            exit 1
          fi
          echo "MISE_VERSION=${mise_version}" >> "${GITHUB_ENV}"
      - name: Resolve Ubuntu WSL image version
        id: wsl-image
        run: |
          etag=$(
            curl --fail-with-body --silent --head --location \
              --write-out '%header{etag}' \
              --output /dev/null \
              "${WSL_IMAGE_URL}"
          )
          etag="${etag//\"/}"
          if [[ -z ${etag} ]]; then
            echo "Failed to read WSL image ETag." >&2
            exit 1
          fi
          echo "etag=${etag}" >> "${GITHUB_OUTPUT}"
      - name: Cache Ubuntu WSL image
        id: wsl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wsl-amd64.wsl
          key: ubuntu-wsl-resolute-${{ steps.wsl-image.outputs.etag }}
      - name: Download Ubuntu WSL image
        if: steps.wsl-cache.outputs.cache-hit != 'true'
        run: curl --fail-with-body --location --output wsl-amd64.wsl "${WSL_IMAGE_URL}"
      - name: Run installer
        run: bash tasks/test/installer-linux
        env:
          GITHUB_TOKEN: ${{ github.token }}
          __CI: true
          TEST_PROFILE: ${{ matrix.profile }}
          # use head sha for pull requests because github.sha is set to the merge commit
          GIT_COMMIT_SHA: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.sha, github.sha) }}
          MISE_LOG_LEVEL: ${{ case(runner.debug == '1', 'debug', 'info') }}
  test-macos:
    needs: changes
    if: ${{ needs.changes.outputs.installers == 'true' }}
    name: macOS installer (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [bare, personal]
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install twice and verify
        run: bash tasks/test/installer-macos
        env:
          TEST_PROFILE: ${{ matrix.profile }}
          GITHUB_TOKEN: ${{ github.token }}
          __CI: true
          GIT_COMMIT_SHA: ${{ case(github.event_name == 'pull_request', github.event.pull_request.head.sha, github.sha) }}
          MISE_LOG_LEVEL: ${{ case(runner.debug == '1', 'debug', 'info') }}
  test-worker:
    needs: changes
    name: Worker (Vitest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: bun,node
    permissions:
      contents: read # for checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            mise.toml
            mise.lock
            tasks.toml
            tasks/
            worker/
          persist-credentials: false
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
      - name: Run tests
        run: mise run worker:test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build Worker
        if: ${{ needs.changes.outputs.worker == 'true' }}
        run: mise run worker:build
      - name: Upload preview or validate deployment
        if: ${{ needs.changes.outputs.worker == 'true' }}
        uses: risu729/wrangler-deploy-action@e943f9681fb250fa0d0a104bd95ea121c510d192 # v1.2.0
        with:
          mode: ${{ github.event_name == 'pull_request' && 'preview-or-dry-run' || 'dry-run' }}
          working-directory: worker
          config: dist/dotfiles_worker/wrangler.json
          preview-alias: pr-${{ github.event.pull_request.number }}
          cloudflare-account-id: ${{ github.event_name == 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID || '' }}
          cloudflare-api-token: ${{ github.event_name == 'pull_request' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      - name: Package validated Worker
        if: ${{ needs.changes.outputs.worker == 'true' }}
        run: bash tasks/ci/worker-artifact pack
      - name: Upload validated Worker
        if: ${{ needs.changes.outputs.worker == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-build
          path: out/worker-artifact/
          if-no-files-found: error
          retention-days: 7
  verify-worker-artifact:
    name: Verify Worker artifact
    needs: [changes, test-worker]
    if: ${{ needs.changes.outputs.worker == 'true' }}
    permissions:
      contents: read # for checkout in the reusable workflow
    uses: ./.github/workflows/worker-deploy.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ yet.
  deploy-worker:
    name: Deploy validated Worker
    needs: [changes, lint, test-bats, test-worker, test-linux, test-macos, verify-worker-artifact]
    if: >-
      ${{ !cancelled() && !inputs.health && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) && needs.changes.result == 'success' && needs.lint.result == 'success' && needs.test-bats.result == 'success' && needs.test-worker.result == 'success' && needs.test-linux.result == 'success' && needs.test-macos.result == 'success' && needs.verify-worker-artifact.result == 'success' }}
    permissions:
      contents: read # for checkout in the reusable workflow
    uses: ./.github/workflows/worker-deploy.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ yet.
    with:
      production: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ci-check:
    name: CI Check
    needs:
      - changes
      - lint
      - test-bats
      - test-linux
      - test-macos
      - test-worker
      - verify-worker-artifact
    if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: exit 1
  actions-timeline:
    name: Generate Actions Timeline
    needs:
      - ci-check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # for actions-timeline
    steps:
      - name: actions-timeline
        uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
