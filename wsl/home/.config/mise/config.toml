# ref: https://mise.jdx.dev/configuration.html#global-config-config-mise-config-toml
#:schema https://mise.jdx.dev/schema/mise.json

[env]
# mise manages the installed Copilot CLI version.
COPILOT_AUTO_UPDATE = "false"
# disable bat paging
BAT_PAGING = "never"
# use powershell instead of pwsh as pwsh is not in the PATH sometimes
BROWSER = "powershell.exe -c Start-Process"
# colored GCC warnings and errors
GCC_COLORS = "error=01;31:warning=01;35:note=01;36:caret=01;32:locus=01:quote=01"
_.path = ["~/.local/bin"]

[tools]
# language tools
node = "latest"
bun = "latest"
aube = "latest"
npm = "latest"
# Don't use the vfox plugin; it doesn't support lockfiles
"aqua:yarn" = "latest"
pnpm = "latest"
java = "latest"
gradle = "latest"
rust = "latest"
python = "latest"
go = "latest"
pkl = "latest"

# mise requirements
cargo-binstall = "latest"
uv = "latest"
# for completion
usage = "latest"
watchexec = "latest"

# cli tools
jq = "latest"
yq = "latest"
github-cli = "latest"
glab = "latest"
"github:seachicken/gh-poi" = { version = "latest", bin = "gh-poi" }
"aqua:siketyan/ghr" = { version = "latest", prerelease = true }
fzf = "latest"
bitwarden = "latest"
"aqua:mame/wsl2-ssh-agent" = "latest"
jc = "latest"
delta = "latest"
ripgrep = "latest"
eza = "latest"
bat = "latest"
fd = "latest"
atuin = "latest"
zoxide = "latest"
btop = "latest"
xh = "latest"
jd = "latest"
sd = "latest"
kubecolor = "latest"
kubectl = "latest"
kubectx = "latest"
kubeseal = "latest"
mitmproxy = "latest"
doggo = "latest"
pitchfork = { version = "latest", postinstall = """
src="$(dirname "$(readlink -f ~/.config/mise/config.toml)")/../../../systemd/pitchfork-nonroot.conf"
sudo install -D -m644 "$src" /etc/systemd/system/pitchfork.service.d/nonroot.conf
sudo "$MISE_TOOL_INSTALL_PATH/pitchfork" boot disable
sudo "$MISE_TOOL_INSTALL_PATH/pitchfork" boot enable
if [ -d /run/systemd/system ]; then
  sudo systemctl restart pitchfork.service
fi
""" }
miller = "latest"
glow = "latest"
"github:risu729/kuebiko" = { version = "latest", minimum_release_age = "0s" }
"github:risu729/biwa" = { version = "latest", minimum_release_age = "0s" }
"github:risu729/mikoto" = { version = "latest", minimum_release_age = "0s" }
"pipx:markitdown" = { version = "latest", extras = "pdf,docx,pptx,xlsx" }
# resend dropped npm provenance from 6.18.1 onward while its release automation is
# reworked, which trips aube's no-downgrade trust policy.
# ref: https://github.com/resend/resend-node/issues/1061
"npm:resend-cli" = { version = "latest", allow_builds = ["esbuild"], trust_policy_excludes = [
	"resend@>=6.18.1",
] }

# ai agents
codex = { version = "latest", minimum_release_age = "0s" }
"npm:ccusage" = "latest"
claude = { version = "latest", minimum_release_age = "0s" }
copilot = "latest"
hunk = "latest"
herdr = "latest"

# linter/formatter tools
hk = "latest"
biome = "latest"
oxlint = "latest"
oxfmt = "latest"
actionlint = "latest"
ghalint = "latest"
pinact = "latest"
zizmor = "latest"
taplo = "latest"
prettier = "latest"
shfmt = "latest"
shellcheck = "latest"
yamlfmt = "latest"
yamllint = "latest"
lychee = "latest"
typos = "latest"
hadolint = "latest"

# uni tools
numbat = "latest"
typst = "latest"

# mise development
aqua = "latest"
pipx = "latest"
# Global RUSTC_WRAPPER must stay unset; mbx defers to an existing wrapper and skips caching.
# setup installs a persistent rustc wrapper so plain cargo commands also hit the cache.
mr-boxington = { version = "latest", postinstall = "mbx setup" }
gcloud = "latest"

[settings]
experimental = true
minimum_release_age = "3h"
cargo.binstall_native = true

[settings.npm]
package_manager = "aube"

[settings.python]
# disable python-build
compile = false

[task_config]
includes = [".config/mise/tasks"]

[shell_alias]
clip = "clip.exe"
m = "mise"
mx = "mise x"
l = "eza --all --long --git"
k = "kubecolor"
aptup = "sudo apt update && sudo apt upgrade -y"
cux = "ccusage codex"
