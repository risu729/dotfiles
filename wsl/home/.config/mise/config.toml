# ref: https://mise.jdx.dev/configuration.html#global-config-config-mise-config-toml
#:schema https://mise.jdx.dev/schema/mise.json
# Tools and settings that are safe on any machine. `config.personal.toml` adds
# the personal ones under `-E personal`, and `config.linux.toml` the Linux ones.

[env]
# disable bat paging
BAT_PAGING = "never"
# colored GCC warnings and errors
GCC_COLORS = "error=01;31:warning=01;35:note=01;36:caret=01;32:locus=01:quote=01"
_.path = ["~/.local/bin"]

[tools]
# language tools
node = "latest"
bun = "latest"
aube = "latest"
npm = "latest"
# Don't use the vfox plugin; it doesn't support lockfiles
"aqua:yarn" = "latest"
pnpm = "latest"
java = "latest"
gradle = "latest"
rust = "latest"
python = "latest"
go = "latest"
pkl = "latest"

# mise requirements
cargo-binstall = "latest"
uv = "latest"
# for completion
usage = "latest"
watchexec = "latest"

# cli tools
jq = "latest"
yq = "latest"
github-cli = "latest"
"github:seachicken/gh-poi" = { version = "latest", bin = "gh-poi" }
"aqua:siketyan/ghr" = { version = "latest", prerelease = true }
fzf = "latest"
jc = "latest"
delta = "latest"
ripgrep = "latest"
# The lockfile pins one backend per tool and aqua has no macOS asset for eza, so
# macOS builds it with cargo instead.
eza = { version = "latest", os = ["linux"] }
"cargo:eza" = { version = "latest", os = ["macos"] }
bat = "latest"
fd = "latest"
atuin = "latest"
zoxide = "latest"
# No macOS release; installed there as `brew:btop` by the dotfiles bootstrap.
btop = { version = "latest", os = ["linux"] }
xh = "latest"
jd = "latest"
sd = "latest"
kubecolor = "latest"
kubectl = "latest"
kubectx = "latest"
kubeseal = "latest"
mitmproxy = "latest"
doggo = "latest"
# The boot service below is systemd-only and runs as my user. The script is a
# template, and MISE_ENV is not exported to it, so the profile is checked here.
pitchfork = { version = "latest", postinstall = """
[ "$(uname -s)" = Linux ] || exit 0
{% if mise_env is defined and "personal" in mise_env %}
src="$(dirname "$(readlink -f ~/.config/mise/config.toml)")/../../../systemd/pitchfork-nonroot.conf"
sudo install -D -m644 "$src" /etc/systemd/system/pitchfork.service.d/nonroot.conf
sudo "$MISE_TOOL_INSTALL_PATH/pitchfork" boot disable
sudo "$MISE_TOOL_INSTALL_PATH/pitchfork" boot enable
if [ -d /run/systemd/system ]; then
  sudo systemctl restart pitchfork.service
fi
{% endif %}
""" }
miller = "latest"
glow = "latest"
"pipx:markitdown" = { version = "latest", extras = "pdf,docx,pptx,xlsx" }

# ai agents
entire = "latest"
codex = { version = "latest", minimum_release_age = "0s" }
"npm:ccusage" = "latest"
claude = { version = "latest", minimum_release_age = "0s" }
hunk = "latest"
herdr = "latest"

# linter/formatter tools
hk = "latest"
biome = "latest"
oxlint = "latest"
oxfmt = "latest"
actionlint = "latest"
ghalint = "latest"
pinact = "latest"
zizmor = "latest"
taplo = "latest"
prettier = "latest"
shfmt = "latest"
shellcheck = "latest"
yamlfmt = "latest"
yamllint = "latest"
lychee = "latest"
typos = "latest"
hadolint = "latest"

# calculator
numbat = "latest"

# mise development
aqua = "latest"
pipx = "latest"
# Global RUSTC_WRAPPER must stay unset; mbx defers to an existing wrapper and skips caching.
mr-boxington = "latest"

[settings]
experimental = true
minimum_release_age = "3h"
cargo.binstall_native = true

[settings.npm]
package_manager = "aube"

[settings.python]
# disable python-build
compile = false

[task_config]
includes = [".config/mise/tasks"]

# Route plain `cargo` through the mbx build cache everywhere. This is what
# `mbx setup --global` writes. The `mr_boxington` Rust tool option is not used
# because a project's own `rust` entry replaces the global one, dropping the
# option, whereas `[wrappers]` merge across configs.
[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[shell_alias]
m = "mise"
mx = "mise x"
l = "eza --all --long --git"
k = "kubecolor"
cux = "ccusage codex"
