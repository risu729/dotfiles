#:tombi schema.strict = false
# mise 2026.9.14 supports bootstrap.secrets but omits it from the JSON schema.
# Opt in only when provisioning or rotating the personal Linux tunnel token.
# Ordinary bootstrap runs leave the existing token untouched.

[bootstrap.secrets]
cloudflare_tunnel_token = "CLOUDFLARE_TUNNEL_TOKEN"

[dotfiles."~/.config/cloudflared/tunnel-token"]
source = "unix/cloudflared/tunnel-token.tera"
mode = "template"
permissions = "0600"
variants = [{ os = "linux", profile = "personal" }]
