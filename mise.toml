# ref: https://mise.jdx.dev/configuration.html

min_version = "2026.9.12"

[vars]
PS_SCRIPT_ANALYZER_VERSION = "1.25.0"

[tools]
bun = "1.4.2"
aube = "v2.4.0"
node = "26.10.0"
github-cli = "2.101.0"
hk = "2.2.0"
oxlint = "1.72.0"
oxfmt = "0.70.0"
actionlint = "1.7.12"
ghalint = "1.5.6"
pinact = "5.0.0"
zizmor = "1.30.1"
tombi = "1.5.5"
rumdl = "v0.2.77"
shfmt = "3.14.1"
shellcheck = "0.11.0"
yamlfmt = "0.21.0"
# required for pipx backend
uv = "0.12.19"
yamllint = "1.38.0"
lychee = "0.24.2"
typos = "1.50.3"
"npm:typescript" = "7.0.2"
hadolint = "2.15.1"
betterleaks = "v1.8.1"
powershell = "7.6.6"
bats = "1.14.0"

[settings]
experimental = true
# Git hooks use `mise exec`; installing missing global tools must not block commits.
# Install required development tools explicitly with `mise install`.
exec_auto_install = false
dotfiles.default_mode = "symlink"

[settings.npm]
package_manager = "aube"

[deps.bun]
auto = true
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]
run = "bun install --frozen-lockfile"

[deps.bun-worker]
auto = true
dir = "worker"
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]
run = "bun install --frozen-lockfile"

[task_config]
includes = ["tasks.toml", "tasks", "worker/tasks.toml", "worker/tasks"]

# Shared task metadata stays with the root task includes, not bootstrap fragments.
[task_templates.worker]
dir = "{{ config_root }}/worker"

# Keep build and type generation free of this prerequisite; depends=[] inherits it.
[task_templates."worker:runtime"]
dir = "{{ config_root }}/worker"
depends = ["worker:generate:types"]

# Hooks are Tera templates, so Linux-only steps are skipped on other platforms
# and my own infrastructure is only set up with the personal profile.
[bootstrap.hooks.pre-packages]
run = '''
{% if os() == "linux" %}
# Persist passwordless sudo and replace the legacy repository symlink if present.
sudo mkdir --parents /etc/sudoers.d
sudoers_path=/etc/sudoers.d/01-users-nopasswd
sudoers_temporary_path=/etc/sudoers.d/.01-users-nopasswd.tmp
printf '%s\n' 'ALL ALL=(ALL:ALL) NOPASSWD: ALL' |
  sudo tee "${sudoers_temporary_path}" >/dev/null
sudo chmod 0440 "${sudoers_temporary_path}"
sudo mv --force "${sudoers_temporary_path}" "${sudoers_path}"

sudo install --directory --mode=0755 /etc/apt/keyrings

arch=$(dpkg --print-architecture)
# shellcheck source=/dev/null
codename=$(. /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME}}")

# ref: https://docs.docker.com/engine/install/ubuntu/#install-using-the-repository
curl --fail-with-body --silent --show-error --location https://download.docker.com/linux/ubuntu/gpg |
  sudo tee /etc/apt/keyrings/docker.asc >/dev/null
echo "deb [arch=${arch} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${codename} stable" |
  sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
{% endif %}
{% if os() == "linux" and mise_env is defined and "personal" in mise_env %}
# ref: https://pkg.cloudflare.com/
curl --fail-with-body --silent --show-error --location https://pkg.cloudflare.com/cloudflare-main.gpg |
  sudo tee /etc/apt/keyrings/cloudflare-main.gpg >/dev/null
echo "deb [signed-by=/etc/apt/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" |
  sudo tee /etc/apt/sources.list.d/cloudflared.list >/dev/null
{% endif %}
{% if os() == "macos" %}
# The package plan evaluates every cask, and a cask from a third-party tap
# needs Ruby 3 or newer on PATH, so pour Ruby before the plan that includes Orca.
mise bootstrap packages apply brew:ruby --yes
{% endif %}
'''

[bootstrap.hooks.post-packages]
run = '''
{% if os() == "linux" %}
username=$(whoami)
if ! groups "${username}" | grep --quiet --word-regexp docker; then
  sudo usermod --append --groups docker "${username}"
fi

{% endif %}
{% if os() == "linux" and mise_env is defined and "personal" in mise_env %}
username=$(whoami)
dotfiles_root=$(git rev-parse --show-toplevel)
sudo install --mode=0644 \
  "${dotfiles_root}/unix/systemd/wsl-cloudflare-ip.service" \
  /etc/systemd/system/wsl-cloudflare-ip.service
sudo install --directory --mode=0755 /etc/ssh/sshd_config.d
sudo install --mode=0644 \
  "${dotfiles_root}/unix/ssh/ca.pub" \
  /etc/ssh/ca.pub
sudo install --mode=0644 \
  "${dotfiles_root}/unix/ssh/10-cloudflare-access.conf" \
  /etc/ssh/sshd_config.d/10-cloudflare-access.conf

if [ -d /run/systemd/system ]; then
  sudo loginctl enable-linger "${username}"
  sudo systemctl daemon-reload
  sudo systemctl enable --now wsl-cloudflare-ip.service
  sudo /usr/sbin/sshd -t
  sudo systemctl enable --now ssh.service
  sudo systemctl reload ssh.service
fi
{% endif %}
'''

[bootstrap.hooks.post-dotfiles]
run = '''
{% if os() == "linux" %}
sudo update-desktop-database
{% endif %}
'''

[bootstrap.hooks.post-defaults]
run = '''
{% if os() == "macos" %}
/bin/sh "{{ config_root }}/macos/disable-auto-brightness.sh"
{% endif %}
'''

[bootstrap.hooks.post-tools]
run = '''
mise exec -- gh extension install github/gh-stack --force

for agent in universal claude-code; do
  mise exec -- gh skill install mattpocock/skills skills/productivity/grilling \
    --agent "${agent}" --scope user --pin main --force
  mise exec -- gh skill install github/gh-stack gh-stack \
    --agent "${agent}" --scope user --force
done

mise exec -- npx --yes skills add https://github.com/stablyai/orca \
  --skill orca-cli \
  --skill computer-use \
  --skill orchestration \
  --agent claude-code \
  --agent codex \
  --agent universal \
  --global \
  -y

for integration in claude codex; do
  mise exec -- herdr integration install "${integration}"
done
'''

[bootstrap.hooks.final]
run = '''
if [ -t 0 ] && [ -t 1 ]; then
  dotfiles_root=$(git rev-parse --show-toplevel)
  if ! mise exec -- bash -i -c "${dotfiles_root}/unix/setup-git.ts"; then
    echo "Git setup failed; run unix/setup-git.ts manually if needed." >&2
  fi
fi
'''

# macOS preferences. They are inert on Linux and can be applied alone with
# `mise bootstrap macos defaults apply`.
[bootstrap.macos.defaults.NSGlobalDomain]
# Disable natural scrolling.
"com.apple.swipescrolldirection" = false
# Mouse tracking speed.
"com.apple.mouse.scaling" = 2.5
# Mouse scroll speed.
"com.apple.scrollwheel.scaling" = 1.0
# Disable user interface sound effects.
"com.apple.sound.uiaudio.enabled" = 0
# Always show filename extensions.
AppleShowAllExtensions = true
# Disable text substitutions that corrupt pasted code and commands.
NSAutomaticDashSubstitutionEnabled = false
NSAutomaticPeriodSubstitutionEnabled = false
NSAutomaticQuoteSubstitutionEnabled = false
# Keyboard navigation: move focus between all controls with Tab.
AppleKeyboardUIMode = 2
# Expand save dialogs by default.
NSNavPanelExpandedStateForSaveMode = true
NSNavPanelExpandedStateForSaveMode2 = true

[bootstrap.macos.defaults."com.apple.WindowManager"]
# Tile windows without margins.
EnableTiledWindowMargins = false

[bootstrap.macos.defaults."com.apple.desktopservices"]
# Do not write .DS_Store files to network volumes.
DSDontWriteNetworkStores = true

[bootstrap.macos.defaults."com.apple.finder"]
# Search the current folder instead of the whole Mac.
FXDefaultSearchScope = "SCcf"
# Show the full POSIX path in the window title.
_FXShowPosixPathInTitle = true

[bootstrap.macos.defaults."com.apple.screencapture"]
# macOS falls back to the Desktop when the directory is missing.
location = "~/Pictures/Screenshots"
# Capture windows without the drop shadow.
disable-shadow = true

# Modifier keys of the built-in keyboard (`0-0-0`), which take effect after the
# next login. The values are HID usages: `0xFF00000003` and `0xFF0100000003`
# are Globe/fn, `0x7000000E3`/`0x7000000E7` are left/right Command, and
# `0x700000039` is Caps Lock.
# - Globe/fn -> Command, so the bottom-left key matches Ctrl on Windows
# - Command -> Globe/fn
# - Caps Lock -> Globe/fn
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.keyboard.modifiermapping.0-0-0"
host = "current"

[[bootstrap.macos.defaults_entries.value]]
HIDKeyboardModifierMappingSrc = 280379760050179
HIDKeyboardModifierMappingDst = 30064771299

[[bootstrap.macos.defaults_entries.value]]
HIDKeyboardModifierMappingSrc = 1095216660483
HIDKeyboardModifierMappingDst = 30064771303

[[bootstrap.macos.defaults_entries.value]]
HIDKeyboardModifierMappingSrc = 30064771299
HIDKeyboardModifierMappingDst = 1095216660483

[[bootstrap.macos.defaults_entries.value]]
HIDKeyboardModifierMappingSrc = 30064771303
HIDKeyboardModifierMappingDst = 1095216660483

[[bootstrap.macos.defaults_entries.value]]
HIDKeyboardModifierMappingSrc = 30064771129
HIDKeyboardModifierMappingDst = 1095216660483

[bootstrap.macos.dock]
show_recents = false
# Do not rearrange Spaces based on most recent use.
mru_spaces = false

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
preferred_view_style = "list"
show_extensions_warning = false
save_new_documents_to_cloud = false

[bootstrap.macos.keyboard]
# Use F1, F2, etc. as standard function keys.
fn_state = true
# Fastest repeat rate and shortest delay offered by System Settings.
key_repeat = 2
initial_key_repeat = 15
# Repeat held keys instead of showing the accent menu.
press_and_hold = false
automatic_capitalization = false
automatic_spelling_correction = false

[bootstrap.packages]
"apt:bubblewrap" = "latest"
"apt:build-essential" = "latest"
"apt:clang" = "latest"
"apt:clangd" = "latest"
"apt:clang-format" = "latest"
"apt:cmake" = "latest"
"apt:containerd.io" = "latest"
"apt:desktop-file-utils" = "latest"
"apt:docker-buildx-plugin" = "latest"
"apt:docker-ce" = "latest"
"apt:docker-ce-cli" = "latest"
"apt:docker-compose-plugin" = "latest"
"apt:ffmpeg" = "latest"
"apt:gdb" = "latest"
"apt:graphviz" = "latest"
"apt:libssl-dev" = "latest"
"apt:llvm" = "latest"
"apt:openssh-server" = "latest"
"apt:parallel" = "latest"
"apt:pkg-config" = "latest"
"apt:strace" = "latest"
"apt:xdg-utils" = "latest"
"apt:zip" = "latest"
# macOS packages. mise installs them itself, so Homebrew is not required.
# btop has no macOS release in any mise backend, so `[tools]` in the global
# config skips it there.
"brew:btop" = { os = "macos" }
# A current git instead of the one bundled with the Xcode Command Line Tools.
"brew:git" = { os = "macos" }
# mise evaluates the Ruby definition of a cask from a third-party tap, such as
# Orca below, with Ruby 3 or newer on PATH; macOS ships Ruby 2.6.
"brew:ruby" = { os = "macos" }
# These app casks declare auto_updates=true. Adopt existing bundles in place;
# only enable adoption for self-updating app casks when adding more apps.
"brew-cask:claude" = { os = "macos", adopt = true }
# The ChatGPT app replaced the discontinued Codex desktop app (`codex-app`).
"brew-cask:chatgpt" = { os = "macos", adopt = true }
"brew-cask:ghostty" = { os = "macos", adopt = true }
"brew-cask:google-chrome@beta" = { os = "macos", adopt = true }
"brew-cask:notion" = { os = "macos", adopt = true }
"brew-cask:slack" = { os = "macos", adopt = true }
"brew-cask:stablyai/orca/orca" = { os = "macos", adopt = true }
"brew-cask:visual-studio-code@insiders" = { os = "macos", adopt = true }
# Zoom self-updates too, but pkg installers do not use app-bundle adoption.
"brew-cask:zoom" = { os = "macos" }
# Logi Options+ self-updates and runs its installer with sudo; no app to adopt.
"brew-cask:logi-options+" = { os = "macos" }

[bootstrap.repos]
# The installer clones this repo when it is missing, then delegates updates to
# mise, which refuses to touch a dirty worktree, a mismatched origin, or a
# detached HEAD. Personal repositories are declared in `mise.personal.toml`.
"~/.ghr/github.com/risu729/dotfiles" = { url = "https://github.com/risu729/dotfiles.git" }

# An entry without `variants` applies everywhere. An `os` variant restricts it to
# one platform and `profile = "personal"` to machines bootstrapped with
# `-E personal`; an entry whose variants do not match is skipped.
[dotfiles]
"~/.agents" = { source = "unix/home/.agents", mode = "copy" }
"~/.bashrc" = { source = "unix/home/.bashrc", variants = [{ os = "linux" }] }
"~/.claude/CLAUDE.md" = "unix/home/.codex/AGENTS.md"
"~/.claude/settings.json" = { source = "unix/home/.claude/settings.json", mode = "template" }
"~/.claude/skills/pr-tree" = "unix/home/.agents/skills/pr-tree"
"~/.codex" = { source = "unix/home/.codex", mode = "symlink-each" }
"~/.cursor/rules/global/RULE.md" = "unix/home/.codex/AGENTS.md"
"~/.ghr" = { source = "unix/home/.ghr", mode = "symlink-each" }
"~/.hushlogin" = "unix/home/.hushlogin"

# Paths excluded here are linked by the entries below under narrower variants.
# A pattern without `/` matches that name at any depth, so keep the names unique.
[dotfiles."~/.config"]
source = "unix/home/.config"
mode = "symlink-each"
exclude = ["biwa", "*.gitconfig", "mimeapps.list", "*.tera", "pitchfork"]

[dotfiles."~/.config/biwa"]
source = "unix/home/.config/biwa"
mode = "symlink-each"
variants = [{ profile = "personal" }]

[dotfiles."~/.config/git/personal.gitconfig"]
source = "unix/home/.config/git/personal.gitconfig"
variants = [{ profile = "personal" }]

[dotfiles."~/.config/git/unsw.gitconfig"]
source = "unix/home/.config/git/unsw.gitconfig"
variants = [{ profile = "personal" }]

[dotfiles."~/.config/mimeapps.list"]
source = "unix/home/.config/mimeapps.list"
variants = [{ os = "linux" }]

# `env` in miserc selects the profile for every later mise invocation, so the
# file is rendered from the profile that bootstrapped the machine.
[dotfiles."~/.config/mise/miserc.toml"]
source = "unix/home/.config/mise/miserc.toml.tera"
mode = "template"

# The supervisor user and daemon paths are specific to the personal WSL machine.
[dotfiles."~/.config/pitchfork"]
source = "unix/home/.config/pitchfork"
mode = "symlink-each"
variants = [{ os = "linux", profile = "personal" }]

[dotfiles."~/.local"]
source = "unix/home/.local"
mode = "symlink-each"
exclude = ["code", "wsl-open", "applications", "bash-completion"]

[dotfiles."~/.local/bin/code"]
source = "unix/home/.local/bin/code"
variants = [{ os = "linux" }]

[dotfiles."~/.local/bin/wsl-open"]
source = "unix/home/.local/bin/wsl-open"
variants = [{ os = "linux" }]

[dotfiles."~/.local/share/applications"]
source = "unix/home/.local/share/applications"
mode = "symlink-each"
variants = [{ os = "linux" }]

[dotfiles."~/.local/share/bash-completion"]
source = "unix/home/.local/share/bash-completion"
mode = "symlink-each"
variants = [{ os = "linux" }]

[dotfiles."~/.selected_editor"]
source = "unix/home/.selected_editor"
variants = [{ os = "linux" }]

[dotfiles."~/.ssh/config"]
source = "unix/home/.ssh/config"
variants = [{ profile = "personal" }]

[dotfiles."~/.ssh/unsw-z5642102.pub"]
source = "unix/home/.ssh/unsw-z5642102.pub"
variants = [{ profile = "personal" }]

[hooks]
postinstall = """
{% if env.CI is undefined %}
  mise run --no-deps install:ps-script-analyzer
  hk install --mise
{% endif %}
"""
