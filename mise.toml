# ref: https://mise.jdx.dev/configuration.html

min_version = "2026.11.3"

[vars]
PS_SCRIPT_ANALYZER_VERSION = "1.25.0"

# Keep tools here: conf.d tools own .config/mise/mise.lock instead.
[tools]
bun = "1.4.4"
aube = "v2.9.0"
node = "26.13.0"
github-cli = "2.103.3"
hk = "2.11.1"
oxlint = "1.72.0"
oxfmt = "0.74.0"
jactionlint = "v2.5.0"
ghalint = "1.6.0"
pinact = "5.0.2"
zizmor = "1.32.0"
tombi = "1.10.0"
rumdl = "v0.3.2"
shfmt = "3.14.1"
shellcheck = "0.11.0"
yamlfmt = "0.21.0"
# required for pipx backend
uv = "0.13.7"
yamllint = "1.38.0"
lychee = "0.24.2"
typos = "1.52.0"
"npm:typescript" = "7.0.2"
hadolint = "2.15.1"
betterleaks = "v1.10.0"
powershell = "7.6.9"
bats = "1.14.0"

[settings]
experimental = true
lockfile = true
lockfile_mode = "generate"
# Git hooks use `mise exec`; installing missing global tools must not block commits.
# Lazy global tools help, but unrelated NON-lazy tools still trigger downloads.
# Install required development tools explicitly with `mise install`.
exec_auto_install = false
dotfiles.default_mode = "symlink"
# Group roots resolve from the source tree in this repository.
dotfiles.root = "{{ config_root }}/unix/home"

[settings.npm]
package_manager = "aube"

# Use a custom name: the built-in aube provider requires aube-lock.yaml.
[deps.aube-root]
auto = true
sources = ["package.json", "pnpm-lock.yaml", ".npmrc"]
outputs = ["node_modules"]
run = """
if [ "${DOTFILES_SKIP_ROOT_AUBE_INSTALL:-}" != "1" ]; then
  aube install --frozen-lockfile
fi
"""

[deps.aube-worker]
auto = true
dir = "worker"
sources = ["package.json", "pnpm-lock.yaml", ".npmrc"]
outputs = ["node_modules"]
run = "aube install --frozen-lockfile"

# Shared task metadata stays with the root task includes, not bootstrap fragments.
[task_templates.worker]
dir = "{{ config_root }}/worker"

# Keep build and type generation free of this prerequisite; depends=[] inherits it.
[task_templates."worker:runtime"]
dir = "{{ config_root }}/worker"
depends = ["worker:generate:types"]

[task_config]
includes = ["tasks.toml", "tasks", "worker/tasks.toml"]

# Keep sources here: relative paths are based on the declaring config directory.
# Named groups apply by default and own their overrides and merged settings.
[dotfile_groups.codex]
root = ".codex"
target = "~/.codex"
mode = "symlink-each"

[dotfile_groups.codex.entries]
# Keep application-owned settings and state while managing our shared/MCP keys.
"~/.codex/config.toml/shared" = { source = "../../codex/config.toml", merge = true }
"~/.codex/config.toml/mcp" = { source = "../../codex/mcp.toml", merge = true }

[dotfile_groups.config]
root = ".config"
target = "~/.config"
mode = "symlink-each"

# Group entries are cut out of the walk, including their inferred .tera sources.
[dotfile_groups.config.entries]
"~/.config/biwa" = { variants = [{ profile = "personal" }] }
"~/.config/git/personal.gitconfig" = { variants = [{ profile = "personal" }] }
"~/.config/git/unsw.gitconfig" = { variants = [{ profile = "personal" }] }
"~/.config/mimeapps.list" = { variants = [{ os = "linux" }] }
# Discovery defaults are shared; only the selected profile is merged locally.
"~/.config/mise/miserc.toml" = { mode = "template" }
"~/.config/mise/miserc.local.toml/profile" = { source = "mise/miserc.local.toml.tera", merge = true, template = "tera" }
# The supervisor user and daemon paths are specific to the personal WSL machine.
"~/.config/pitchfork" = { variants = [{ os = "linux", profile = "personal" }] }

[dotfile_groups.ghr]
root = ".ghr"
target = "~/.ghr"
mode = "symlink-each"

[dotfile_groups.local]
root = ".local"
target = "~/.local"
mode = "symlink-each"

[dotfile_groups.local.entries]
"~/.local/bin/code" = { variants = [{ os = "linux" }] }
"~/.local/bin/wsl-open" = { variants = [{ os = "linux" }] }
"~/.local/share/applications" = { variants = [{ os = "linux" }] }
"~/.local/share/bash-completion" = { variants = [{ os = "linux" }] }

# Entries outside group targets apply whichever groups the machine selects.
[dotfiles]
"~/.claude.json/mcp" = { source = "unix/claude/mcp.json", merge = true }
"~/.bashrc" = { source = "unix/home/.bashrc", variants = [{ os = "linux" }] }
"~/.claude/CLAUDE.md" = "unix/home/.codex/AGENTS.md"
"~/.claude/settings.json" = { source = "unix/home/.claude/settings.json", mode = "template" }
"~/.cursor/rules/global/RULE.md" = "unix/home/.codex/AGENTS.md"
"~/.hushlogin" = "unix/home/.hushlogin"

[dotfiles."~/.selected_editor"]
source = "unix/home/.selected_editor"
variants = [{ os = "linux" }]

[dotfiles."~/.ssh/config"]
source = "unix/home/.ssh/config"
variants = [{ profile = "personal" }]

[dotfiles."~/.ssh/unsw-z5642102.pub"]
source = "unix/home/.ssh/unsw-z5642102.pub"
variants = [{ profile = "personal" }]

[hooks]
postinstall = """
{% if env.CI is undefined %}
  mise run --no-deps install:ps-script-analyzer
  hk install --mise
{% endif %}
"""
