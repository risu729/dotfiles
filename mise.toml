# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json
#:tombi schema.strict = false
# mise 2026.8.14 supports bootstrap files, but its published schema omits them.

min_version = "2026.8.14"

[vars]
PS_SCRIPT_ANALYZER_VERSION = "1.25.0"

[tools]
bun = "1.4.0"
aube = "v2.2.0"
node = "26.8.1"
github-cli = "2.98.0"
hk = "1.56.1"
oxlint = "1.72.0"
oxfmt = "0.65.0"
actionlint = "1.7.12"
ghalint = "1.5.6"
pinact = "4.1.1"
zizmor = "1.29.0"
tombi = "1.2.8"
rumdl = "v0.2.62"
shfmt = "3.13.1"
shellcheck = "0.11.0"
yamlfmt = "0.21.0"
# required for pipx backend
uv = "0.12.6"
yamllint = "1.38.0"
lychee = "0.24.2"
typos = "1.49.1"
"npm:typescript" = "7.0.2"
hadolint = "2.15.1"
betterleaks = "v1.8.1"
powershell = "7.6.5"

[settings]
experimental = true
dotfiles.default_mode = "symlink"

[settings.npm]
package_manager = "aube"

[deps.bun]
auto = true
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]
run = "bun install --frozen-lockfile"

[deps.bun-worker]
auto = true
dir = "worker"
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]
run = "bun install --frozen-lockfile"

[task_config]
includes = ["tasks.toml", "tasks", "worker/tasks.toml", "worker/tasks"]

[bootstrap.directories."/etc/codex"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/codex/config.toml"]
source = "./wsl/codex/config.toml"
owner = "root"
group = "root"
mode = "0644"

[dotfiles]
"~/.agents" = { source = "wsl/home/.agents", mode = "copy" }
"~/.bashrc" = "wsl/home/.bashrc"
"~/.claude/CLAUDE.md" = "wsl/home/.codex/AGENTS.md"
"~/.claude/settings.json" = { source = "wsl/home/.claude/settings.json", mode = "template" }
"~/.claude/skills/pr-tree" = "wsl/home/.agents/skills/pr-tree"
"~/.codex" = { source = "wsl/home/.codex", mode = "symlink-each" }
"~/.config" = { source = "wsl/home/.config", mode = "symlink-each" }
"~/.cursor/rules/global/RULE.md" = "wsl/home/.codex/AGENTS.md"
"~/.ghr" = { source = "wsl/home/.ghr", mode = "symlink-each" }
"~/.hushlogin" = "wsl/home/.hushlogin"
"~/.local" = { source = "wsl/home/.local", mode = "symlink-each" }
"~/.selected_editor" = "wsl/home/.selected_editor"
"~/.ssh/config" = "wsl/home/.ssh/config"
"~/.ssh/unsw-z5642102.pub" = "wsl/home/.ssh/unsw-z5642102.pub"

[hooks]
postinstall = """
{% if env.CI is undefined %}
  mise run --no-deps install:ps-script-analyzer
  hk install --mise
{% endif %}
"""
