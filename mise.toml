# ref: https://mise.jdx.dev/configuration.html

min_version = "2026.10.7"

[vars]
PS_SCRIPT_ANALYZER_VERSION = "1.25.0"

# Keep tools here: conf.d tools own .config/mise/mise.lock instead.
[tools]
bun = "1.4.3"
aube = "v2.7.0"
node = "26.11.1"
github-cli = "2.102.0"
hk = "2.5.0"
oxlint = "1.72.0"
oxfmt = "0.72.0"
jactionlint = "2.0.2"
ghalint = "1.5.6"
pinact = "5.0.0"
zizmor = "1.30.1"
tombi = "1.8.0"
rumdl = "v0.2.79"
shfmt = "3.14.1"
shellcheck = "0.11.0"
yamlfmt = "0.21.0"
# required for pipx backend
uv = "0.13.0"
yamllint = "1.38.0"
lychee = "0.24.2"
typos = "1.51.1"
"npm:typescript" = "7.0.2"
hadolint = "2.15.1"
betterleaks = "v1.9.0"
powershell = "7.6.6"
bats = "1.14.0"

[settings]
experimental = true
lockfile_mode = "generate"
# Git hooks use `mise exec`; installing missing global tools must not block commits.
# Install required development tools explicitly with `mise install`.
exec_auto_install = false
dotfiles.default_mode = "symlink"
# Group roots resolve from the source tree in this repository.
dotfiles.root = "unix/home"

[settings.npm]
package_manager = "aube"

[deps.bun]
auto = true
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]
run = "bun install --frozen-lockfile"

[deps.bun-worker]
auto = true
dir = "worker"
sources = ["package.json", "bun.lock"]
outputs = ["node_modules"]
run = "bun install --frozen-lockfile"

# Shared task metadata stays with the root task includes, not bootstrap fragments.
[task_templates.worker]
dir = "{{ config_root }}/worker"

# Keep build and type generation free of this prerequisite; depends=[] inherits it.
[task_templates."worker:runtime"]
dir = "{{ config_root }}/worker"
depends = ["worker:generate:types"]

[task_config]
includes = ["tasks.toml", "tasks", "worker/tasks.toml"]

# Keep sources here: relative paths are based on the declaring config directory.
# Named groups apply by default. Standalone entries retain profile and OS variants.
# Codex discovers copied skill files, so the agents group must remain a copy.
[dotfile_groups.agents]
root = ".agents"
target = "~/.agents"
mode = "copy"

[dotfile_groups.codex]
root = ".codex"
target = "~/.codex"
mode = "symlink-each"

# The walks exclude paths with standalone profile, OS or template entries.
[dotfile_groups.config]
root = ".config"
target = "~/.config"
mode = "symlink-each"
exclude = ["biwa", "*.gitconfig", "mimeapps.list", "*.tera", "pitchfork"]

[dotfile_groups.ghr]
root = ".ghr"
target = "~/.ghr"
mode = "symlink-each"

[dotfile_groups.local]
root = ".local"
target = "~/.local"
mode = "symlink-each"
exclude = ["code", "wsl-open", "applications", "bash-completion"]

# An entry without `variants` applies everywhere. An `os` variant restricts it to
# one platform and `profile = "personal"` to machines bootstrapped with
# `-E personal`; an entry whose variants do not match is skipped.
[dotfiles]
# Merge shared settings and MCP keys; retain unrelated client settings and state.
"~/.claude.json/mcp" = { source = "unix/claude/mcp.json", merge = true }
"~/.codex/config.toml/shared" = { source = "unix/codex/config.toml", merge = true }
"~/.codex/config.toml/mcp" = { source = "unix/codex/mcp.toml", merge = true }
"~/.bashrc" = { source = "unix/home/.bashrc", variants = [{ os = "linux" }] }
"~/.claude/CLAUDE.md" = "unix/home/.codex/AGENTS.md"
"~/.claude/settings.json" = { source = "unix/home/.claude/settings.json", mode = "template" }
"~/.claude/skills/pr-tree" = "unix/home/.agents/skills/pr-tree"
"~/.cursor/rules/global/RULE.md" = "unix/home/.codex/AGENTS.md"
"~/.hushlogin" = "unix/home/.hushlogin"

[dotfiles."~/.config/biwa"]
source = "unix/home/.config/biwa"
mode = "symlink-each"
variants = [{ profile = "personal" }]

[dotfiles."~/.config/git/personal.gitconfig"]
source = "unix/home/.config/git/personal.gitconfig"
variants = [{ profile = "personal" }]

[dotfiles."~/.config/git/unsw.gitconfig"]
source = "unix/home/.config/git/unsw.gitconfig"
variants = [{ profile = "personal" }]

[dotfiles."~/.config/mimeapps.list"]
source = "unix/home/.config/mimeapps.list"
variants = [{ os = "linux" }]

# `env` in miserc selects the profile for every later mise invocation, so the
# file is rendered from the profile that bootstrapped the machine.
[dotfiles."~/.config/mise/miserc.toml"]
source = "unix/home/.config/mise/miserc.toml.tera"
mode = "template"

# The supervisor user and daemon paths are specific to the personal WSL machine.
[dotfiles."~/.config/pitchfork"]
source = "unix/home/.config/pitchfork"
mode = "symlink-each"
variants = [{ os = "linux", profile = "personal" }]

[dotfiles."~/.local/bin/code"]
source = "unix/home/.local/bin/code"
variants = [{ os = "linux" }]

[dotfiles."~/.local/bin/wsl-open"]
source = "unix/home/.local/bin/wsl-open"
variants = [{ os = "linux" }]

[dotfiles."~/.local/share/applications"]
source = "unix/home/.local/share/applications"
mode = "symlink-each"
variants = [{ os = "linux" }]

[dotfiles."~/.local/share/bash-completion"]
source = "unix/home/.local/share/bash-completion"
mode = "symlink-each"
variants = [{ os = "linux" }]

[dotfiles."~/.selected_editor"]
source = "unix/home/.selected_editor"
variants = [{ os = "linux" }]

[dotfiles."~/.ssh/config"]
source = "unix/home/.ssh/config"
variants = [{ profile = "personal" }]

[dotfiles."~/.ssh/unsw-z5642102.pub"]
source = "unix/home/.ssh/unsw-z5642102.pub"
variants = [{ profile = "personal" }]

[hooks]
postinstall = """
{% if env.CI is undefined %}
  mise run --no-deps install:ps-script-analyzer
  hk install --mise
{% endif %}
"""
