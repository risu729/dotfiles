# ref: https://mise.jdx.dev/tasks/

["worker:build"]
extends = "worker"
run = "aube exec --no-install -- cf build"
hide = true
description = "Build the worker for production."

["worker:build:preview"]
extends = "worker"
# Both builds write the same output; serialize them when scheduled together.
wait_for = ["worker:build"]
env = { CLOUDFLARE_PREVIEW_BUILD = "true" }
run = "aube exec --no-install -- cf-vite build"
description = "Build a named Workers Preview."

["worker:dev"]
extends = "worker:runtime"
run = "aube exec --no-install -- cf dev"
description = "Start a local development server for the worker."

["worker:preview"]
extends = "worker"
depends = ["worker:build"]
run = "aube exec --no-install -- vite preview"
description = "Preview the built worker."

["worker:test"]
extends = "worker:runtime"
run = "aube exec --no-install -- vitest run"
description = "Run Worker tests once."

["worker:test:watch"]
extends = "worker:runtime"
run = "aube exec --no-install -- vitest watch --ui"
description = "Watch Worker tests with the Vitest UI."

["worker:generate:types"]
extends = "worker"
run = "aube exec --no-install -- cf workers types"
hide = true
description = "Generate types of Cloudflare Worker runtimes."
