name: dotfiles-ci
services:
  worker:
    build:
      context: ./worker/docker
      args:
        MISE_VERSION: ${MISE_VERSION:-}
    environment:
      CI: "true"
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:4173"]
      interval: 10s
      timeout: 5s
      retries: 5
  test-linux:
    build:
      context: .
      dockerfile: ./docker/wsl/Dockerfile
    depends_on:
      worker:
        condition: service_healthy
    environment:
      CI: "true"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      __CI: ${__CI:-}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
      TEST_PROFILE: ${TEST_PROFILE:-bare}
      MISE_LOG_LEVEL: ${MISE_LOG_LEVEL:-info}
    volumes:
      - ./tasks/test/installer-container:/usr/local/bin/test-installer:ro
    command: ["bash", "/usr/local/bin/test-installer"]
