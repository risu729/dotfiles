# ref: https://mise.jdx.dev/bootstrap.html

# Hooks are Tera templates, so Linux-only steps are skipped on other platforms
# and my own infrastructure is only set up with the personal profile.
[bootstrap.hooks.pre-packages]
run = '''
{% if os() == "linux" %}
# Persist passwordless sudo and replace the legacy repository symlink if present.
sudo mkdir --parents /etc/sudoers.d
sudoers_path=/etc/sudoers.d/01-users-nopasswd
sudoers_temporary_path=/etc/sudoers.d/.01-users-nopasswd.tmp
printf '%s\n' 'ALL ALL=(ALL:ALL) NOPASSWD: ALL' |
  sudo tee "${sudoers_temporary_path}" >/dev/null
sudo chmod 0440 "${sudoers_temporary_path}"
sudo mv --force "${sudoers_temporary_path}" "${sudoers_path}"

sudo install --directory --mode=0755 /etc/apt/keyrings

arch=$(dpkg --print-architecture)
# shellcheck source=/dev/null
codename=$(. /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME}}")

# ref: https://docs.docker.com/engine/install/ubuntu/#install-using-the-repository
curl --fail-with-body --silent --show-error --location https://download.docker.com/linux/ubuntu/gpg |
  sudo tee /etc/apt/keyrings/docker.asc >/dev/null
echo "deb [arch=${arch} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${codename} stable" |
  sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
{% endif %}
{% if os() == "linux" and mise_env is defined and "personal" in mise_env %}
# ref: https://pkg.cloudflare.com/
curl --fail-with-body --silent --show-error --location https://pkg.cloudflare.com/cloudflare-main.gpg |
  sudo tee /etc/apt/keyrings/cloudflare-main.gpg >/dev/null
echo "deb [signed-by=/etc/apt/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" |
  sudo tee /etc/apt/sources.list.d/cloudflared.list >/dev/null
{% endif %}
{% if os() == "macos" %}
# The package plan evaluates every cask, and a cask from a third-party tap
# needs Ruby 3 or newer on PATH, so pour Ruby before the plan that includes Orca.
mise bootstrap packages apply brew:ruby --yes
{% endif %}
'''

[bootstrap.hooks.post-packages]
run = '''
{% if os() == "linux" %}
username=$(whoami)
if ! groups "${username}" | grep --quiet --word-regexp docker; then
  sudo usermod --append --groups docker "${username}"
fi

{% endif %}
{% if os() == "linux" and mise_env is defined and "personal" in mise_env %}
username=$(whoami)
dotfiles_root=$(git rev-parse --show-toplevel)
sudo install --mode=0644 \
  "${dotfiles_root}/unix/systemd/wsl-cloudflare-ip.service" \
  /etc/systemd/system/wsl-cloudflare-ip.service
sudo install --directory --mode=0755 /etc/ssh/sshd_config.d
sudo install --mode=0644 \
  "${dotfiles_root}/unix/ssh/ca.pub" \
  /etc/ssh/ca.pub
sudo install --mode=0644 \
  "${dotfiles_root}/unix/ssh/10-cloudflare-access.conf" \
  /etc/ssh/sshd_config.d/10-cloudflare-access.conf

if [ -d /run/systemd/system ]; then
  sudo loginctl enable-linger "${username}"
  sudo systemctl daemon-reload
  sudo systemctl enable --now wsl-cloudflare-ip.service
  sudo /usr/sbin/sshd -t
  sudo systemctl enable --now ssh.service
  sudo systemctl reload ssh.service
fi
{% endif %}
'''

[bootstrap.hooks.post-dotfiles]
run = '''
{% if os() == "linux" %}
sudo update-desktop-database
{% endif %}
'''

[bootstrap.hooks.post-defaults]
run = '''
{% if os() == "macos" %}
/bin/sh "{{ config_root }}/macos/disable-auto-brightness.sh"
{% endif %}
'''

[bootstrap.hooks.post-tools]
run = '''
mise exec -- gh extension install github/gh-stack --force

for agent in universal claude-code; do
  mise exec -- gh skill install mattpocock/skills skills/productivity/grilling \
    --agent "${agent}" --scope user --pin main --force
  mise exec -- gh skill install github/gh-stack gh-stack \
    --agent "${agent}" --scope user --force
done

mise exec -- npx --yes skills add https://github.com/stablyai/orca \
  --skill orca-cli \
  --skill computer-use \
  --skill orchestration \
  --agent claude-code \
  --agent codex \
  --agent universal \
  --global \
  -y

for integration in claude codex; do
  mise exec -- herdr integration install "${integration}"
done
'''

[bootstrap.hooks.final]
run = '''
if [ -t 0 ] && [ -t 1 ]; then
  dotfiles_root=$(git rev-parse --show-toplevel)
  if ! mise exec -- bash -i -c "${dotfiles_root}/unix/setup-git.ts"; then
    echo "Git setup failed; run unix/setup-git.ts manually if needed." >&2
  fi
fi
'''
