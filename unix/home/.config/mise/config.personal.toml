# ref: https://mise.jdx.dev/configuration/environments.html
# Loaded with `MISE_ENV=personal` only, which `miserc.toml` sets on machines
# bootstrapped with `-E personal`. Locked by `mise.personal.lock`.

[env]
# mise manages the installed Copilot CLI version.
COPILOT_AUTO_UPDATE = "false"

[tools]
# Personal commands are installed on first use. The WSL SSH agent stays eager
# because shell startup invokes it. Backend runtimes remain in config.toml.
# cli tools
bitwarden = { version = "latest", lazy = true }
glab = { version = "latest", lazy = true }
"aqua:mame/wsl2-ssh-agent" = { version = "latest", os = ["linux"] }
"github:risu729/kuebiko" = { version = "latest", minimum_release_age = "0s", lazy = true, lazy_bins = ["kuebiko"] }
"github:risu729/biwa" = { version = "latest", minimum_release_age = "0s", lazy = true, lazy_bins = ["biwa"] }
"github:risu729/mikoto" = { version = "latest", minimum_release_age = "0s", lazy = true, lazy_bins = ["mikoto"] }
# resend dropped npm provenance from 6.18.1 onward while its release automation is
# reworked, which trips aube's no-downgrade trust policy.
# ref: https://github.com/resend/resend-node/issues/1061
"npm:resend-cli" = { version = "latest", lazy = true, lazy_bins = ["resend"], allow_builds = ["esbuild"], trust_policy_excludes = [
	"resend@>=6.18.1",
] }

# ai agents
cursor-agent = { version = "latest", minimum_release_age = "0s", lazy = true }
copilot = { version = "latest", lazy = true }

# uni tools
typst = { version = "latest", lazy = true }

# mise development
gcloud = { version = "latest", lazy = true }

# Cursor Agent self-updates into ~/.local/share/cursor-agent and relinks
# ~/.local/bin/{agent,cursor-agent}, which would shadow the mise-managed install.
# --disable-auto-update is a hidden global flag. `agent` mirrors the official
# installer's short name; a wrapper cannot delegate to itself, so bare
# `cursor-agent` still self-updates.
[wrappers.agent]
command = "cursor-agent"
args = ["--disable-auto-update"]
