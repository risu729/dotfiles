# Included by mise.personal.toml on hosts without a running systemd manager.
# Keep these declarations in sync with linux-services.toml, except for notify.
[bootstrap.files."/etc/ssh/ca.pub"]
phase = "pre-packages"
source = "unix/ssh/ca.pub"
owner = "root"
group = "root"
mode = "0644"
os = "linux"

[bootstrap.files."/etc/ssh/sshd_config.d/10-cloudflare-access.conf"]
phase = "pre-packages"
source = "unix/ssh/10-cloudflare-access.conf"
owner = "root"
group = "root"
mode = "0644"
os = "linux"

[bootstrap.files."/etc/systemd/system/wsl-cloudflare-ip.service"]
phase = "pre-packages"
source = "unix/systemd/wsl-cloudflare-ip.service"
owner = "root"
group = "root"
mode = "0644"
os = "linux"
